name: AI 펀드 실시간 모의투자

on:
  schedule:
    # 한국장 (KST 09:00~15:30 = UTC 00:00~06:30), 평일 30분마다 시작해 장중 2분 간격으로 계속 점검
    - cron: "*/30 0-6 * * 1-5"
    # 미국장 (뉴욕 09:30~16:00, 서머타임 포함 UTC 13:30~21:00)
    - cron: "*/30 13-20 * * 1-5"
    # 그 밖의 시간: 비트코인·대시보드 갱신용 2시간마다
    - cron: "23 */2 * * *"
  workflow_dispatch: {}
  push:
    paths: ["data/selection.json", "config.json", ".github/workflows/trade.yml", "engine.py", "app.py"]

concurrency:
  group: fund
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 설정
        run: |
          git config user.name "ai-fund-bot"
          git config user.email "ai-fund-bot@users.noreply.github.com"
      - name: 원칙에 따라 점검·매매 (장중이면 약 50분 동안 2분마다)
        run: python app.py --loop-minutes 50 --git-sync
      - name: 대시보드 만들기
        run: |
          mkdir -p _site/data
          cp static/index.html _site/
          cp data/portfolio.json data/principles.json data/selection.json _site/data/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: trade
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deploy
        uses: actions/deploy-pages@v5
